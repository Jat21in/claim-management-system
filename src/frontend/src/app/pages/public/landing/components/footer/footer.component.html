<footer class="footer">

  <!-- ── Main grid ─────────────────────────────────────────────────────── -->
  <div class="footer__inner">

    <!-- Link columns -->
    <div class="footer__columns">
      <div class="footer__col" *ngFor="let col of columns">
        <h3 class="footer__col-heading">{{ col.heading }}</h3>
        <ul class="footer__link-list">
          <li *ngFor="let link of col.links">
            <a 
              [href]="link.href" 
              [target]="link.isExternal ? '_blank' : '_self'" 
              [rel]="link.isExternal ? 'noopener noreferrer' : ''"
              class="footer__link"
              [class.footer__link--highlighted]="link.isHighlighted"
              [class.footer__link--external]="link.isExternal">
              {{ link.label }}
              <span *ngIf="link.isExternal" class="footer__external-icon">↗</span>
            </a>
          </li>
        </ul>
      </div>
    </div>

    <!-- Brand panel -->
    <div class="footer__brand">
      <div class="footer__brand-logo">
        <div class="footer__logo-box" aria-hidden="true">✦</div>
        <span class="footer__brand-name">
          Claim<span class="footer__brand-highlight">Core</span>
        </span>
      </div>

      <p class="footer__brand-desc">{{ brandDescription }}</p>

      <!-- Quick links with documentation highlighted -->
      <div class="footer__quick-links">
        <a 
          [href]="documentationUrl" 
          target="_blank" 
          rel="noopener noreferrer"
          class="footer__quick-link footer__quick-link--primary">
          📖 Documentation
        </a>
        <a 
          [href]="githubUrl" 
          target="_blank" 
          rel="noopener noreferrer"
          class="footer__quick-link">
          💻 GitHub
        </a>
      </div>

      <div class="footer__socials">
        <a *ngFor="let s of socialLinks" 
           [href]="s.href" 
           [target]="'_blank'"
           [rel]="'noopener noreferrer'"
           [attr.aria-label]="s.name" 
           class="footer__social-btn"
           [class]="'footer__social-btn--' + s.icon">
          
          <!-- GitHub -->
          <svg *ngIf="s.icon === 'github'" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.15 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.62.24 2.85.12 3.15.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/>
          </svg>

          <!-- LinkedIn -->
          <svg *ngIf="s.icon === 'linkedin'" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 0 1-2.063-2.065 2.064 2.064 0 1 1 2.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z" />
          </svg>

          <!-- Twitter / X -->
          <svg *ngIf="s.icon === 'twitter'" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-4.714-6.231-5.401 6.231H2.744l7.73-8.835L1.254 2.25H8.08l4.713 5.231zm-1.161 17.52h1.833L7.084 4.126H5.117z" />
          </svg>

          <!-- Slack -->
          <svg *ngIf="s.icon === 'slack'" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M5.042 15.165a2.528 2.528 0 0 1-2.52 2.523A2.528 2.528 0 0 1 0 15.165a2.527 2.527 0 0 1 2.522-2.52h2.52v2.52zM6.313 15.165a2.527 2.527 0 0 1 2.521-2.52 2.527 2.527 0 0 1 2.521 2.52v6.313A2.528 2.528 0 0 1 8.834 24a2.528 2.528 0 0 1-2.521-2.522v-6.313zM8.834 5.042a2.528 2.528 0 0 1-2.521-2.52A2.528 2.528 0 0 1 8.834 0a2.528 2.528 0 0 1 2.521 2.522v2.52H8.834zM8.834 6.313a2.528 2.528 0 0 1 2.521 2.521 2.528 2.528 0 0 1-2.521 2.521H2.522A2.528 2.528 0 0 1 0 8.834a2.528 2.528 0 0 1 2.522-2.521h6.312zM18.956 8.834a2.528 2.528 0 0 1 2.522-2.521A2.528 2.528 0 0 1 24 8.834a2.528 2.528 0 0 1-2.522 2.521h-2.522V8.834zM17.688 8.834a2.528 2.528 0 0 1-2.523 2.521 2.527 2.527 0 0 1-2.52-2.521V2.522A2.527 2.527 0 0 1 15.165 0a2.528 2.528 0 0 1 2.523 2.522v6.312zM15.165 18.956a2.528 2.528 0 0 1 2.523 2.522A2.528 2.528 0 0 1 15.165 24a2.527 2.527 0 0 1-2.52-2.522v-2.522h2.52zM15.165 17.688a2.527 2.527 0 0 1-2.52-2.523 2.526 2.526 0 0 1 2.52-2.52h6.313A2.527 2.527 0 0 1 24 15.165a2.528 2.528 0 0 1-2.522 2.523h-6.313z" />
          </svg>
        </a>
      </div>
    </div>

  </div><!-- /footer__inner -->

  <!-- ── Divider ────────────────────────────────────────────────────────── -->
  <div class="footer__divider" role="separator"></div>

  <!-- ── Copyright bar ─────────────────────────────────────────────────── -->
  <div class="footer__bottom">
    <p class="footer__copy">
      &copy; {{ year }} {{ brandName }}. All rights reserved.
    </p>
    <p class="footer__copy-links">
      <a [href]="documentationUrl" target="_blank" rel="noopener noreferrer">Documentation</a>
      <span class="footer__dot">•</span>
      <a [href]="githubUrl" target="_blank" rel="noopener noreferrer">GitHub</a>
    </p>
  </div>

  <!-- ── Background watermark ──────────────────────────────────────────── -->
  <div class="footer__watermark" aria-hidden="true">{{ brandName }}</div>

</footer>
