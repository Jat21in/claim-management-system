<section class="contact-section">

    <!-- LEFT: GLOBE -->
    <div class="left">
        <app-globe></app-globe>
    </div>

    <!-- RIGHT: FORM -->
    <div class="right">

        <h2>Get in Touch</h2>
        <p>We’d love to hear from you.</p>

        <form (ngSubmit)="submit()">

            <input [(ngModel)]="formData.name" name="name" placeholder="Name" required />
            <input [(ngModel)]="formData.email" name="email" placeholder="Email" required />
            <input [(ngModel)]="formData.subject" name="subject" placeholder="Subject" required />
            <textarea [(ngModel)]="formData.message" name="message" placeholder="Message"></textarea>

            <button type="submit" [disabled]="isSubmitting">
                {{ isSubmitting ? 'Sending...' : 'Send Message' }}
            </button>

        </form>

    </div>

</section>
