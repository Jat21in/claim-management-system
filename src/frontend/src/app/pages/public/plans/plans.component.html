<h1>Our Health Plans</h1>

<ng-container *ngIf="plans$ | async as plans; else loading">
    <div *ngFor="let plan of plans" style="margin-bottom:20px">
        <h2>{{ plan.name }}</h2>
        <p>{{ plan.description }}</p>

        <p><strong>Coverage:</strong> ₹{{ plan.insuredAmount }}</p>
        <p><strong>Duration:</strong> {{ plan.durationInMonths }} months</p>

        <ul>
            <li *ngFor="let feature of plan.features">
                {{ feature }}
            </li>
        </ul>

        <a [routerLink]="['/plans', plan.planId]">View Details</a>
    </div>
</ng-container>

<ng-template #loading>
    <p>Loading plans...</p>
</ng-template>
