<form [formGroup]="form" (ngSubmit)="submit()" class="space-y-4 text-white">

    <!-- Full Name -->
    <input formControlName="fullName" placeholder="Full name" class="w-full px-4 py-2 bg-white/5 border border-white/10 rounded-lg" />

    <!-- Email -->
    <input formControlName="email" type="email" placeholder="Email" class="w-full px-4 py-2 bg-white/5 border border-white/10 rounded-lg" />

    <!-- Password -->
    <input formControlName="password" type="password" placeholder="Password" class="w-full px-4 py-2 bg-white/5 border border-white/10 rounded-lg" />

    <!-- Date of Birth -->
    <input formControlName="dateOfBirth" type="date" [max]="maxDob" class="w-full px-4 py-2 bg-white/5 border border-white/10 rounded-lg text-white" />

    <p *ngIf="form.controls.dateOfBirth.touched && form.controls.dateOfBirth.invalid" class="text-red-400 text-xs">
        Please select a valid date of birth
    </p>

    <!-- ✅ Selected Plan Info - Improved -->
    <div *ngIf="selectedPlanId" class="bg-purple-500/10 border border-purple-500/30 rounded-lg p-3 text-sm">
        <span class="text-purple-400">✨ Plan selected:</span>
        <span class="text-white">This plan will be activated upon registration</span>
    </div>

    <!-- Success Message with countdown -->
    <div *ngIf="success" class="bg-green-500/20 text-green-400 px-4 py-3 rounded-lg text-sm border border-green-500/30">
        {{ success }}
        <div class="text-xs text-green-400/70 mt-1">Redirecting to login...</div>
    </div>

    <!-- Error -->
    <div *ngIf="error" class="bg-red-500/20 text-red-400 px-4 py-3 rounded-lg text-sm border border-red-500/30">
        {{ error }}
    </div>

    <!-- Submit -->
    <button type="submit" [disabled]="loading" class="w-full py-2 bg-accent text-black font-semibold rounded-lg disabled:opacity-60">
        {{ loading ? 'Creating account...' : 'Create account' }}
    </button>

</form>
