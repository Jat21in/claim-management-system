<h1 class="text-xl font-semibold mb-4">Profile</h1>

<!-- ✅ Loading -->
<div *ngIf="loading">
    Loading profile…
</div>

<!-- ✅ FORM -->
<form *ngIf="!loading" [formGroup]="form" (ngSubmit)="submit()" class="space-y-4 max-w-md">

    <!-- READ ONLY -->
    <input formControlName="fullName" placeholder="Full Name" class="w-full px-3 py-2 border rounded opacity-70" />

    <input formControlName="email" placeholder="Email" class="w-full px-3 py-2 border rounded opacity-70" />

    <!-- DOB -->
    <input type="date" formControlName="dateOfBirth" class="w-full px-3 py-2 border rounded" />

    <!-- ADDRESS -->
    <input formControlName="street" placeholder="Street" class="w-full px-3 py-2 border rounded" />

    <input formControlName="city" placeholder="City" class="w-full px-3 py-2 border rounded" />

    <input formControlName="state" placeholder="State" class="w-full px-3 py-2 border rounded" />

    <input formControlName="country" placeholder="Country" class="w-full px-3 py-2 border rounded" />

    <input formControlName="postalCode" placeholder="Postal Code" class="w-full px-3 py-2 border rounded" />

    <!-- CONTACT -->
    <input formControlName="contactNumber" placeholder="Contact Number" class="w-full px-3 py-2 border rounded" />

    <!-- ERROR -->
    <p *ngIf="error" class="text-red-500 text-sm">
        {{ error }}
    </p>

    <!-- SUCCESS -->
    <p *ngIf="success" class="bg-green-100 text-green-700 px-3 py-2 rounded text-sm">
        {{ success }}
    </p>

    <button type="submit" [disabled]="saving" class="px-4 py-2 bg-green-600 text-white rounded">

    {{ saving ? 'Saving...' : 'Save Profile' }}
  </button>

</form>
