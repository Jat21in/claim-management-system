<h3 class="text-lg font-semibold mb-3">Submit a Claim</h3>

<form [formGroup]="form" (ngSubmit)="submit()" class="space-y-4">

    <!-- ✅ Claim Date -->
    <div>
        <input type="date" formControlName="claimDate" class="w-full px-3 py-2 border rounded" />

        <p *ngIf="form.controls.claimDate.touched && form.controls.claimDate.invalid" class="text-red-500 text-xs mt-1">
            Claim date is required
        </p>
    </div>

    <!-- ✅ Amount -->
    <div>
        <input type="number" formControlName="amount" placeholder="Claim amount" class="w-full px-3 py-2 border rounded" />

        <p *ngIf="form.controls.amount.touched && form.controls.amount.invalid" class="text-red-500 text-xs mt-1">
            Amount must be greater than 0
        </p>
    </div>

    <!-- ✅ Description -->
    <textarea formControlName="description" rows="3" placeholder="Description (optional)" class="w-full px-3 py-2 border rounded"></textarea>

    <!-- ✅ ERROR -->
    <p *ngIf="error" class="bg-red-100 text-red-700 px-3 py-2 rounded text-sm">
        {{ error }}
    </p>

    <!-- ✅ SUCCESS -->
    <p *ngIf="success" class="bg-green-100 text-green-700 px-3 py-2 rounded text-sm">
        {{ success }}
    </p>

    <!-- ✅ BUTTON -->
    <button type="submit" [disabled]="loading" class="px-4 py-2 bg-accent text-black font-semibold rounded disabled:opacity-60">

    {{ loading ? 'Submitting...' : 'Submit Claim' }}

  </button>

</form>
