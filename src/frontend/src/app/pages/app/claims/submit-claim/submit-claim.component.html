<div class="submit-page">

    <div class="page-header">
        <a routerLink="/app/claims" class="back-link">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M19 12H5M12 5l-7 7 7 7"/>
      </svg> Back to claims
        </a>
        <h1 class="page-title">Submit a Claim</h1>
        <p class="page-sub">Fill in the details below to file a new claim</p>
    </div>

    <div class="form-card">

        <form [formGroup]="form" (ngSubmit)="submit()" class="claim-form">

            <!-- Claim Date -->
            <div class="field-group">
                <label class="field-label">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>
          </svg>
          Claim Date
        </label>
                <input type="date" formControlName="claimDate" class="form-input" [class.input-error]="form.controls.claimDate.touched && form.controls.claimDate.invalid" />
                <p class="field-error" *ngIf="form.controls.claimDate.touched && form.controls.claimDate.invalid">
                    Please select a valid claim date
                </p>
            </div>

            <!-- Amount -->
            <div class="field-group">
                <label class="field-label">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <circle cx="12" cy="12" r="9"/><path d="M12 7v10M9 9.5C9 8.1 10.3 7 12 7s3 1.1 3 2.5S13.7 12 12 12s-3 1.1-3 2.5S10.3 17 12 17s3-1.1 3-2.5"/>
          </svg>
          Claim Amount (₹)
        </label>
                <div class="amount-field">
                    <span class="currency-prefix">₹</span>
                    <input type="number" formControlName="amount" placeholder="0" class="form-input amount" [class.input-error]="form.controls.amount.touched && form.controls.amount.invalid" />
                </div>
                <p class="field-error" *ngIf="form.controls.amount.touched && form.controls.amount.invalid">
                    Amount must be greater than ₹0
                </p>
            </div>

            <!-- Description -->
            <div class="field-group">
                <label class="field-label">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/>
          </svg>
          Description <span class="optional-tag">optional</span>
        </label>
                <textarea formControlName="description" rows="4" placeholder="Briefly describe the reason for this claim…" class="form-input textarea"></textarea>
            </div>

            <!-- Feedback -->
            <div class="feedback-error" *ngIf="error">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/>
        </svg> {{ error }}
            </div>

            <div class="feedback-success" *ngIf="success">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M20 6L9 17l-5-5"/>
        </svg> {{ success }}
            </div>

            <!-- Submit -->
            <div class="form-actions">
                <a routerLink="/app/claims" class="btn-cancel">Cancel</a>
                <button type="submit" [disabled]="loading" class="btn-submit">
          <span *ngIf="!loading">Submit Claim</span>
          <span *ngIf="loading" class="saving-state">
            <span class="mini-spinner"></span> Submitting…
          </span>
        </button>
            </div>

        </form>
    </div>
</div>
